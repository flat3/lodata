name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [ ready_for_review, synchronize, opened ]

jobs:
  matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - laravel: 13
            php: "8.4"

          - laravel: 12
            php: "8.4"
          - laravel: 12
            php: "8.3"

          - laravel: 11
            php: "8.2"
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb-1.21.0
      - name: Composer
        run: |
          rm composer.lock
          composer require laravel/framework:^${{ matrix.laravel }}
      - name: Test
        env:
          CREATE_SNAPSHOTS: false
        run: composer test -- --exclude-group redis --exclude-group mongo

  sqlsrv:
    runs-on: ubuntu-22.04
    name: Microsoft SQL Server
    steps:
      - uses: actions/checkout@v4
      - name: MSSQL Server
        run: docker run --detach -p 1433:1433 -e SA_PASSWORD=Your_password123 -e ACCEPT_EULA=Y mcr.microsoft.com/mssql/server
      - uses: shivammathur/setup-php@v2
        with:
          extensions: pdo_sqlsrv, odbc, pdo_odbc, mongodb-1.21.0
      - name: Composer
        run: composer update

      - name: Wait for containers
        run: |
          max=20
          for i in $(seq 1 $max); do
            if /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Your_password123 -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "::error::SQL Server failed to start after $max seconds"
          docker ps -a
          SQL_ID=$(docker ps --filter ancestor=mcr.microsoft.com/mssql/server --format "{{.ID}}")
          if [ -n "$SQL_ID" ]; then
            docker logs $SQL_ID || true
          else
            echo "No running SQL Server container found!"
          fi
          exit 1

      - name: Test
        env:
          CREATE_SNAPSHOTS: false
          DATABASE_URL: sqlsrv://sa:Your_password123@localhost:1433/msdb
        run: composer test -- --group sql --group eloquent

  postgres:
    runs-on: ubuntu-22.04
    name: PostgreSQL
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL
        run: docker run --detach -p 5432:5432 -e POSTGRES_PASSWORD=my-secret-pw postgres:latest postgres -c shared_buffers=256MB -c max_connections=2000
      - uses: shivammathur/setup-php@v2
        with:
          extensions: pdo_pgsql, mongodb-1.21.0
      - name: Composer
        run: composer update

      - name: Wait for containers
        run: |
          max=20
          for i in $(seq 1 $max); do
            if pg_isready -q -d postgres -U postgres -h localhost; then
              echo "Postgres is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres failed to start after $max seconds"
          docker ps -a
          POSTGRES_ID=$(docker ps --filter ancestor=postgres --format "{{.ID}}")
          if [ -n "$POSTGRES_ID" ]; then
            docker logs $POSTGRES_ID || true
          else
            echo "No running Postgres container found!"
          fi
          exit 1

      - name: Test
        env:
          CREATE_SNAPSHOTS: false
          DATABASE_URL: pgsql://postgres:my-secret-pw@localhost:5432/postgres?charset=utf8
        run: composer test -- --group sql --group eloquent

  mysql:
    runs-on: ubuntu-22.04
    name: MySQL
    steps:
      - uses: actions/checkout@v4
      - name: MySQL
        run: docker run --detach -p 3306:3306 -e MYSQL_ROOT_PASSWORD=my-secret-pw -e MYSQL_DATABASE=testing mysql:latest mysqld --max-connections=8000
      - uses: shivammathur/setup-php@v2
        with:
          extensions: pdo_mysql, mongodb-1.21.0
      - name: Composer
        run: composer update

      - name: Wait for containers
        run: |
          max=20
          for i in $(seq 1 $max); do
            if mysqladmin ping -h 127.0.0.1 --password=my-secret-pw > /dev/null 2>&1; then
              echo "MySQL is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "::error::MySQL failed to start after $max seconds"
          docker ps -a
          MYSQL_ID=$(docker ps --filter ancestor=mysql --format "{{.ID}}")
          if [ -n "$MYSQL_ID" ]; then
            docker logs $MYSQL_ID || true
          else
            echo "No running MySQL container found!"
          fi
          exit 1

      - name: Test
        env:
          CREATE_SNAPSHOTS: false
          DATABASE_URL: mysql://root:my-secret-pw@127.0.0.1:3306/testing
        run: composer test -- --group sql --group eloquent

  mongo:
    runs-on: ubuntu-22.04
    name: MongoDB
    steps:
      - uses: actions/checkout@v4
      - name: Mongo
        run: docker run --detach -p 27017:27017 mongo
      - uses: shivammathur/setup-php@v2
        with:
          extensions: mongodb-1.21.0
      - name: Composer
        run: composer update

      - name: Wait for containers
        run: |
          max=20
          for i in $(seq 1 $max); do
            if nc -z localhost 27017; then
              echo "Mongo is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Mongo failed to start after $max seconds"
          docker ps -a
          MONGO_ID=$(docker ps --filter ancestor=mongo --format "{{.ID}}")
          if [ -n "$MONGO_ID" ]; then
            docker logs $MONGO_ID || true
          else
            echo "No running Mongo container found!"
          fi
          exit 1

      - name: Test
        env:
          CREATE_SNAPSHOTS: false
        run: composer test -- --group mongo

  redis:
    runs-on: ubuntu-22.04
    name: Redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          extensions: redis, mongodb-1.21.0
      - name: Composer
        run: composer update

      - name: Start Redis
        run: docker run --detach -p 6379:6379 redis

      - name: Wait for containers
        run: |
          max=20
          for i in $(seq 1 $max); do
            if nc -z localhost 6379; then
              echo "Redis is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Redis failed to start after $max seconds"
          docker ps -a
          REDIS_ID=$(docker ps --filter ancestor=redis --format "{{.ID}}")
          if [ -n "$REDIS_ID" ]; then
            docker logs $REDIS_ID || true
          else
            echo "No running Redis container found!"
          fi
          exit 1

      - name: Test
        env:
          CREATE_SNAPSHOTS: false
        run: composer test -- --group redis

  analysis:
    runs-on: ubuntu-22.04
    name: Analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get git commited-at
        run: echo "GIT_COMMITTED_AT=$(git log -1 --pretty=format:%ct)" >> $GITHUB_ENV

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mongodb-1.21.0

      - name: Start Docker containers
        run: |
          docker run --detach -p 5432:5432 -e POSTGRES_PASSWORD=my-secret-pw postgres:latest postgres -c shared_buffers=256MB -c max_connections=2000
          docker run --detach -p 27017:27017 mongo

      - name: Composer
        run: composer update

      - name: Wait for Postgres
        run: |
          max=20
          for i in $(seq 1 $max); do
            if pg_isready -q -d postgres -U postgres -h localhost; then
              echo "Postgres is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres failed to start after $max seconds"
          docker ps -a
          POSTGRES_ID=$(docker ps --filter ancestor=postgres --format "{{.ID}}")
          if [ -n "$POSTGRES_ID" ]; then
            docker logs $POSTGRES_ID || true
          else
            echo "No running Postgres container found!"
          fi
          exit 1

      - name: Wait for Mongo
        run: |
          max=20
          for i in $(seq 1 $max); do
            if nc -z localhost 27017; then
              echo "Mongo is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Mongo failed to start after $max seconds"
          docker ps -a
          MONGO_ID=$(docker ps --filter ancestor=mongo --format "{{.ID}}")
          if [ -n "$MONGO_ID" ]; then
            docker logs $MONGO_ID || true
          else
            echo "No running Mongo container found!"
          fi
          exit 1

      - name: Analyze
        env:
          COMPOSER_PROCESS_TIMEOUT: 10000
        run: composer analyse